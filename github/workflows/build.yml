name: Android CI

# 推到 GitHub 后无需任何配置即可编译：
# - push / PR：自动编译 Debug + Release，并在 Actions 页面提供 APK 下载
# - 推送 v* 标签：额外自动创建 GitHub Release 并附上两个 APK
# - 也可以在 Actions 页面手动点 "Run workflow"
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 常规构建最小权限；只有发版 job 单独提权到 contents: write
permissions:
  contents: read

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 准备 Gradle（wrapper 校验 + 依赖缓存）
        uses: gradle/actions/setup-gradle@v4
        with:
          # PR 只读缓存，避免未合并代码污染主干缓存
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: 准备 Android SDK 命令行工具
        uses: android-actions/setup-android@v3

      - name: 安装 compileSdk 36 与 build-tools 36.0.0
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: 确认 gradlew 可执行
        run: chmod +x gradlew

      - name: 打印构建环境
        run: |
          java -version
          ./gradlew --version

      - name: 编译 Debug / Release
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: 产物清单与校验和
        run: |
          ls -lh app/build/outputs/apk/*/*.apk
          sha256sum app/build/outputs/apk/*/*.apk

      - name: 上传 Debug APK（可直接安装）
        uses: actions/upload-artifact@v4
        with:
          name: OneSSH-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 上传 Release APK（未签名）
        uses: actions/upload-artifact@v4
        with:
          name: OneSSH-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载本次构建的 APK
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.apk
