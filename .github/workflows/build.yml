name: Android CI

# 推到 GitHub 后无需任何配置即可编译：
# - push / PR：自动编译 Debug + Release，并在 Actions 页面提供 APK 下载
# - 推送 v* 标签：额外自动创建 GitHub Release 并附上两个 APK
# - 手动 Run workflow：可选勾选「同时创建 GitHub Release」，无需打标签即可发版
# 版本号唯一来源：app/build.gradle.kts 的 versionCode / versionName。
# 每次构建自动读取，产物名与 Release 附件都会带上该版本号。
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish_release:
        description: '同时创建 GitHub Release 并附上 APK（无需打标签）'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 常规构建最小权限；只有发版 job 单独提权到 contents: write
permissions:
  contents: read

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 准备 Gradle（wrapper 校验 + 依赖缓存）
        uses: gradle/actions/setup-gradle@v4
        with:
          # PR 只读缓存，避免未合并代码污染主干缓存
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # 不用 android-actions/setup-android：v3 的 packages 默认是
      # "tools platform-tools"，legacy tools 包已被 Google 下架，会在这一步
      # 直接报 "Failed to find package 'tools'" 并退出 1。
      # ubuntu-latest 自带 Android SDK，定位预装的 sdkmanager 即可。
      - name: 定位 Android SDK 与 sdkmanager
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR=$(command -v sdkmanager || true)
          if [ -z "$SDKMGR" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "$SDKMGR" ]; then
            SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -path "*/bin/sdkmanager" 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$SDKMGR" ]; then
            echo "::error::在 $ANDROID_HOME 下未找到 sdkmanager"
            exit 1
          fi
          chmod +x "$SDKMGR" 2>/dev/null || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdkmanager=$SDKMGR"
          "$SDKMGR" --sdk_root="$ANDROID_HOME" --version
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "SDKMGR=$SDKMGR" >> "$GITHUB_ENV"

      - name: 接受许可并安装 compileSdk 36 / build-tools 36.0.0
        run: |
          yes 2>/dev/null | "$SDKMGR" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "=== 已安装的关键包 ==="
          "$SDKMGR" --sdk_root="$ANDROID_HOME" --list_installed \
            | grep -E "platforms;android-36|build-tools;36.0.0|platform-tools" || true

      - name: 确认 gradlew 可执行
        run: chmod +x gradlew

      - name: 打印构建环境
        run: |
          java -version
          ./gradlew --version

      - name: 读取版本号
        id: version
        run: |
          V=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          C=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$V" ] || [ -z "$C" ]; then
            echo "::error::未能从 app/build.gradle.kts 读取 versionName / versionCode"
            exit 1
          fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$C" >> "$GITHUB_OUTPUT"
          echo "版本：$V (versionCode $C)"

      - name: 校验标签与版本号一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          V="${{ steps.version.outputs.name }}"
          if [ "$TAG" != "$V" ]; then
            echo "::warning::标签 v$TAG 与 app/build.gradle.kts 的 versionName $V 不一致，请核对"
          fi

      - name: 编译 Debug / Release
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: 归档带版本号的 APK
        run: |
          V="${{ steps.version.outputs.name }}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/OneSSH-${V}-debug.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/OneSSH-${V}-release-unsigned.apk"
          ls -lh dist
          sha256sum dist/*.apk

      - name: 上传 Debug APK（可直接安装）
        uses: actions/upload-artifact@v4
        with:
          name: OneSSH-${{ steps.version.outputs.name }}-debug
          path: dist/*-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: 上传 Release APK（未签名）
        uses: actions/upload-artifact@v4
        with:
          name: OneSSH-${{ steps.version.outputs.name }}-release-unsigned
          path: dist/*-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: 发布 Release
    # 只有 v* 标签，或手动运行时勾选了 publish_release，才创建 Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载本次构建的 APK
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.build.outputs.version) }}
          name: OneSSH ${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/**/*.apk
